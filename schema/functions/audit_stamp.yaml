name: audit_stamp
language: plpgsql
returns: trigger
comment: |-
  BEFORE INSERT/UPDATE trigger for the `audit` mixin. Stamps created_at /
  updated_at / created_by / updated_by from the actor GUC ({{actor_guc}}).

  When the actor is unset, created_by / updated_by are left NULL. That is
  tolerated only in the bootstrap window, where schema-flow keeps the *_by
  columns nullable until the post-seed tighten phase (a backfill fills them
  first). In production the columns are NOT NULL, so a write with no actor
  set is rejected by the constraint — the app sets {{actor_guc}} per request.
body: >-
  DECLARE
    actor bigint := NULLIF(current_setting('{{actor_guc}}', true), '')::bigint;
  BEGIN
    IF TG_OP = 'INSERT' THEN
      NEW.created_at := CURRENT_TIMESTAMP;
      NEW.created_by := actor;
      NEW.updated_at := NEW.created_at;
      NEW.updated_by := actor;
    ELSE
      NEW.updated_at := CURRENT_TIMESTAMP;
      NEW.updated_by := actor;
    END IF;
    RETURN NEW;
  END;
security: invoker
volatility: volatile
